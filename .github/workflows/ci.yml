name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Runner preflight
        run: |
          echo "GitHub-hosted runner started successfully."
          uname -a
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: Backend/requirements-dev.txt
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r Backend/requirements-dev.txt
      - name: Run backend tests
        working-directory: Backend
        run: pytest -q
      - name: Compile backend
        working-directory: Backend
        run: python -m compileall -q backend

  frontend:
    name: Expo client checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Runner preflight
        run: |
          echo "GitHub-hosted runner started successfully."
          uname -a
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: Frontend
        run: npm ci
      - name: Run source tests
        working-directory: Frontend
        run: npm test
      - name: Typecheck
        working-directory: Frontend
        run: npm run typecheck
      - name: Lint
        working-directory: Frontend
        run: npm run lint
  runner-smoke:
    name: Hosted runner smoke test
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Runner preflight
        run: |
          echo "The ubuntu-slim GitHub-hosted runner started successfully."
          uname -a
