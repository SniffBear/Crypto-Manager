name: Expand Nexus Crypto Manager source package

on:
  push:
    branches:
      - main
    paths:
      - "releases/Nexus-Crypto-Manager-GitHub-Source.zip"
      - ".github/workflows/expand-source.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: expand-nexus-source-main
  cancel-in-progress: false

jobs:
  expand-source:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Safely expand source archive
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path, PurePosixPath
          from zipfile import ZipFile

          archive = Path("releases/Nexus-Crypto-Manager-GitHub-Source.zip")
          prefix = "Nexus-Crypto-Manager/"
          excluded_parts = {".git", "node_modules", ".venv", "venv", "__pycache__", ".pytest_cache"}
          excluded_suffixes = {".pem", ".key", ".p12", ".pfx", ".wallet", ".db", ".sqlite", ".sqlite3"}
          written = []

          if not archive.is_file():
              raise SystemExit(f"Missing source archive: {archive}")

          with ZipFile(archive) as zf:
              bad = zf.testzip()
              if bad:
                  raise SystemExit(f"ZIP integrity check failed: {bad}")

              for info in zf.infolist():
                  if info.is_dir():
                      continue
                  name = info.filename
                  if not name.startswith(prefix):
                      raise SystemExit(f"Unexpected archive root: {name!r}")

                  rel_text = name[len(prefix):]
                  rel = PurePosixPath(rel_text)
                  if not rel_text or rel.is_absolute() or ".." in rel.parts:
                      raise SystemExit(f"Unsafe archive path: {name!r}")
                  if any(part in excluded_parts for part in rel.parts):
                      continue
                  if rel.name == ".env":
                      continue
                  if rel.suffix.lower() in excluded_suffixes:
                      continue

                  target = Path(*rel.parts)
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(zf.read(info))
                  written.append(rel.as_posix())

          if not written:
              raise SystemExit("Archive contained no eligible source files.")

          print(f"Expanded {len(written)} source files.")
          for path in written:
              print(path)
          PY

      - name: Commit extracted source tree
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git commit -m "Expand Nexus Crypto Manager source files"
          git push origin HEAD:main
